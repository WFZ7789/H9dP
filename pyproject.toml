[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "h9dp"
version = "0.1.0"
description = "Native-resolution Himawari sequence pressure-deficit estimation"
requires-python = ">=3.11"
license = {text = "0BSD"}
dependencies = ["numpy>=2", "torch>=2.5", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

