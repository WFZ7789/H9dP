data:
  manifest: HIMAWARI_data/manifest.csv
  records: HIMAWARI_data/records.csv
  labels: MOTIS_cyclone_records.json
  cache_dir: runs/h9dp/native500_v2
  reuse_cache: runs/h9dp/native500_v1
  crop_size: 500
  first_training_year: 2020
  validation_year: 2026
  validation_fraction: 0.5
  split_seed: 42
output_dir: runs/training
model:
  channels: 128
  residual_blocks: 16
  dilations: [1, 2, 1, 4, 1, 8, 1, 16, 1, 2, 1, 4, 1, 8, 1, 16]
  head_width: 128
  head_dropout: 0.05
  activation_checkpointing: true
training:
  seed: 42
  epochs: 200
  learning_rate: 0.0003
  minimum_learning_rate: 0.000001
  lr_patience: 8
  lr_factor: 0.5
  weight_decay: 0.001
  batch_size: 4
  effective_batch_size: 8
  workers: 2
  prefetch_factor: 1
  pin_memory: false
  backbone_gradient_clip: 5.0
  head_gradient_clip: 5.0
  precision: bf16
  torch_compile: true
  compile_mode: default
augmentation:
  rotation_probability: 0.5
  translation_probability: 0.5
  maximum_translation: 32
  noise_kelvin: 0.1

