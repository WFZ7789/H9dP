data:
  cache_dir: runs/h9dp/native500_v2
  new_cache_dir: /mnt/data/H9dP/datasets/himawari_1000_2016_2019
  records: MOTIS_cyclone_records.json
  motis_csv: /mnt/data/H9dP/reference/motis/260212/MOTIS_dataset_260212.csv
  work_dir: /mnt/data/H9dP/runs/m1_adapt/data_v1
model:
  architecture: m1/adapt-v1
  frames: 6
  bands: 4
  image_size: 500
  radii: [32, 96]
  channels: [8, 12, 24, 32, 32]
  frame_width: 32
  temporal_width: 32
training:
  seed: 42
  learning_rate: 0.0003
  lr_milestones: [13, 25]
  weight_decay: 0.001
  batch_size: 4
  num_workers: 0
  gradient_clip: 1.0
  precision: bf16
  torch_compile: true
  compile_mode: default
  activation_checkpointing: false
  quality_weights: {Good: 2.0, Fair: 1.0, Poor: 0.5}
crossfit:
  outer_folds: 2
  inner_folds: 2
  ridge_alpha: 10.0
output_dir: /mnt/data/H9dP/runs/m1_adapt
compiler_cache: /mnt/data/H9dP/runs/m1_adapt/compiler_cache
